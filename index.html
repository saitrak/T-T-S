<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - Text to Speech</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }
    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }
    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }
    .upload-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .upload-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }
    .upload-box i {
      font-size: 2.5rem;
      color: #ff6f61;
    }
    .upload-box textarea {
      width: 100%;
      height: 100px;
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      resize: none;
      font-family: 'Poppins', sans-serif;
    }
    .upload-box textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .controls-container {
      margin-top: 2rem;
      text-align: center;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .control-group {
      margin-bottom: 1.5rem;
    }
    .control-group h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #ff6f61;
    }
    select {
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 100%;
      max-width: 300px;
      font-family: 'Poppins', sans-serif;
    }
    select option {
      background: #0f0f0f;
      color: #fff;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
      justify-content: center;
    }
    .slider-container label {
      min-width: 80px;
      text-align: right;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      max-width: 300px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff6f61;
      cursor: pointer;
      transition: all 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: #ff3b2f;
      transform: scale(1.1);
    }
    .slider-value {
      min-width: 40px;
      text-align: left;
      font-size: 0.9rem;
      color: #ff6f61;
    }
    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 2rem auto;
      display: block;
      transition: all 0.3s;
      font-weight: 600;
    }
    .process-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(255, 111, 97, 0.3);
    }
    .process-btn:disabled {
      background: #cccccc;
      color: #666666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Text to Speech</h1>
    <p>Convert text to speech with different voices and settings</p>
  </section>
  <div class="tool-container">
    <div class="upload-box">
      <i class="fas fa-comment-dots"></i>
      <textarea id="text-to-convert" placeholder="Type or paste your text here..."></textarea>
    </div>
    <div class="controls-container">
      <div class="control-group">
        <h3>Voice Settings</h3>
        <select id="voice-select"></select>
      </div>
      <div class="control-group">
        <h3>Speech Settings</h3>
        <div class="slider-container">
          <label for="rate-slider">Speed:</label>
          <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
          <span class="slider-value" id="rate-value">1.0</span>
        </div>
        <div class="slider-container">
          <label for="pitch-slider">Pitch:</label>
          <input type="range" id="pitch-slider" min="0.5" max="2" step="0.1" value="1">
          <span class="slider-value" id="pitch-value">1.0</span>
        </div>
        <div class="slider-container">
          <label for="volume-slider">Volume:</label>
          <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
          <span class="slider-value" id="volume-value">1.0</span>
        </div>
      </div>
    </div>
    <button class="process-btn" id="convert-btn">Generate Speech</button>
  </div>
  <script>
    // DOM Elements
    const textarea = document.getElementById("text-to-convert");
    const voiceList = document.getElementById("voice-select");
    const speechBtn = document.getElementById("convert-btn");
    const rateSlider = document.getElementById("rate-slider");
    const pitchSlider = document.getElementById("pitch-slider");
    const volumeSlider = document.getElementById("volume-slider");
    const rateValue = document.getElementById("rate-value");
    const pitchValue = document.getElementById("pitch-value");
    const volumeValue = document.getElementById("volume-value");

    // Speech synthesis variables
    let synth = speechSynthesis;
    let voices = [];
    let selectedVoiceIndex = 0;
    let isSpeaking = false;

    // Update slider value displays
    rateSlider.addEventListener("input", () => {
      rateValue.textContent = rateSlider.value;
    });
    pitchSlider.addEventListener("input", () => {
      pitchValue.textContent = pitchSlider.value;
    });
    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = volumeSlider.value;
    });

    // Populate voice list with all available voices
    function populateVoiceList() {
      voices = synth.getVoices();
      voiceList.innerHTML = "";
      
      if (voices.length === 0) {
        let option = document.createElement("option");
        option.textContent = "Loading voices...";
        voiceList.appendChild(option);
        speechBtn.disabled = true;
        setTimeout(populateVoiceList, 100);
        return;
      }
      
      const prevSelectedVoice = voices[selectedVoiceIndex];
      
      voices.forEach((voice, i) => {
        let option = document.createElement("option");
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = i;
        if (voice.default) {
          option.textContent += " — DEFAULT";
          selectedVoiceIndex = i;
        }
        voiceList.appendChild(option);
        if (prevSelectedVoice && voice.name === prevSelectedVoice.name && voice.lang === prevSelectedVoice.lang) {
          voiceList.value = i;
        }
      });
      
      speechBtn.disabled = false;
    }

    // Initialize voices
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // Load voices when the page loads
    document.addEventListener('DOMContentLoaded', () => {
      populateVoiceList();
      // Some browsers need this double call to load voices properly
      setTimeout(populateVoiceList, 100);
    });

    // Store selected voice when changed
    voiceList.addEventListener("change", () => {
      selectedVoiceIndex = voiceList.value;
    });

    // Generate Speech button click event
    speechBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      // Cancel any current speech
      synth.cancel();
      
      if (textarea.value !== "" && voices.length > 0) {
        isSpeaking = true;
        speechBtn.innerText = "Stop";
        
        const utterance = new SpeechSynthesisUtterance(textarea.value);
        utterance.voice = voices[voiceList.value];

        // Set speech parameters from sliders
        utterance.rate = parseFloat(rateSlider.value);
        utterance.pitch = parseFloat(pitchSlider.value);
        utterance.volume = parseFloat(volumeSlider.value);

        // When speech ends
        utterance.onend = () => {
          isSpeaking = false;
          speechBtn.innerText = "Generate Speech";
        };

        // Handle errors
        utterance.onerror = (event) => {
          console.error("SpeechSynthesis error:", event);
          isSpeaking = false;
          speechBtn.innerText = "Generate Speech";
        };

        // Speak the text immediately
        synth.speak(utterance);
      }
    });
  </script>
</body>
</html>
